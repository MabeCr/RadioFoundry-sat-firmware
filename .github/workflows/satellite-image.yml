# Copyright (c) 2026 The RadioFoundry Authors
#
# The satellite builds' firmware images, built in the cloud and published as GitHub pre-releases, so they can be
# downloaded on a phone and installed from there (docs/testing/README.md, docs/dev/ci.md). One image for each board that
# lists SATELLITE_VARS in its config.mk, or the board given by hand: the board's satellite build (tools/satellite.sh: the
# radio's own defaults plus tracking and the cuts a radio with little RAM needs; NOT the maximal configuration, which
# turns every language on), built with its platform's pinned compiler like ci.yml's firmware jobs, then stack-checked.
# Each board is a job of its own (fail-fast off), so one board's failure never holds back another's image, and each
# publishes its own pre-release `satellite-<board>-<commit>` named after the radio, so nobody flashes the wrong file from
# a phone; the newest five of each board are kept.
# The images are CODEC-LESS by construction (no codecs/ in a checkout): the installer keeps the codec already in a
# RadioFoundry radio. A job step fails the run if anything with the codec could be in the output. Runs only in the fork
# this fork-specific workflow lives in.
name: Satellite image

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "core/**"
      - "hal/**"
      - "drivers/**"
      - "platform/**"
      - "boards/**"
      - "config/**"
      - "Makefile"
      - "tools/maximal.sh"
      - "tools/satellite.sh"
      - ".github/workflows/satellite-image.yml"
  workflow_dispatch:
    inputs:
      board:
        description: The board to build (a boards/ id); empty for every board that lists SATELLITE_VARS in its config.mk
        default: ""

concurrency:
  group: satellite-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # the pre-release
  packages: read    # the ghcr.io compiler image

jobs:
  boards:
    name: boards
    if: github.repository == 'MabeCr/RadioFoundry-sat-firmware'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.which.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          submodules: false   # the board list needs only the boards and the registry
      - name: Which boards
        id: which
        env:
          WANTED: ${{ inputs.board }}
        run: |
          set -eu
          boards=$WANTED
          if [ -z "$boards" ]; then   # every board that lists a satellite build of its own (SATELLITE_VARS in config.mk)
            for d in boards/*/; do
              b=$(basename "$d")
              [ -f "$d/board.mk" ] || continue
              [ -n "$(make -s BOARD="$b" print-satellite-vars 2>/dev/null)" ] && boards="$boards $b"
            done
          fi
          [ -n "$boards" ] || { echo "::error::no board lists SATELLITE_VARS: give the board input"; exit 1; }
          # each board's toolchain from the registry (its platform's [toolchain] id), and its name for the release page
          matrix=$(for b in $boards; do
            tc=$(python3 tools/boards.py platform "$(python3 tools/boards.py get "$b" platform)" toolchain.id)
            name=$(python3 tools/boards.py get "$b" name)
            jq -cn --arg board "$b" --arg toolchain "$tc" --arg name "$name" '$ARGS.named'
          done | jq -cs .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "boards: $matrix"

  image:
    name: image (${{ matrix.board }})
    needs: boards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false   # each board builds, stack-checks and publishes on its own
      matrix:
        include: ${{ fromJSON(needs.boards.outputs.matrix) }}
    env:
      BOARD: ${{ matrix.board }}
      BOARD_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          submodules: false   # tools/checkout-submodules.sh: the runner image's copies, then the network
      - name: third_party submodules
        run: tools/checkout-submodules.sh
      - name: Toolchain (platform.toml [toolchain]), Arm
        if: matrix.toolchain == 'arm'
        uses: ./.github/actions/toolchain
        with:
          toolchain: arm
      - name: Toolchain (platform.toml [toolchain]), C-SKY
        id: tc_csky
        if: matrix.toolchain == 'csky'
        uses: ./.github/actions/toolchain
        with:
          toolchain: csky
          image: ${{ vars.RFOUNDRY_CSKY_IMAGE }}
          registry: ${{ vars.RFOUNDRY_CSKY_REGISTRY }}
          registry-user: ${{ vars.RFOUNDRY_CSKY_REGISTRY_USER || github.actor }}
          registry-token: ${{ secrets.RFOUNDRY_CSKY_REGISTRY_TOKEN || github.token }}

      - name: Build the satellite configuration, warnings are failures
        env:
          RUN: ${{ steps.tc_csky.outputs.run }}   # empty, or the csky-elf image's run.sh
        run: |
          set -eu -o pipefail
          $RUN tools/satellite.sh "$BOARD" 2>&1 | tee build.log
          if grep -qi 'warning:' build.log; then echo "::error::the $BOARD build has warnings"; grep -i 'warning:' build.log | sort -u | head; exit 1; fi

      - name: Static stack check
        env:
          RUN: ${{ steps.tc_csky.outputs.run }}
        run: |
          set -eu -o pipefail
          $RUN tools/satellite.sh "$BOARD" stack-check 2>&1 | tee stack.log
          grep -qE '^stack check .*: every task fits' stack.log || { echo "::error::a $BOARD task's stack does not fit"; exit 1; }

      - name: Collect the image, and make sure the codec is not in it
        run: |
          set -eu
          mkdir -p dist
          # the codec is never in a public image (AGENTS.md rule 2): no codec file beside it, none in the checkout
          if [ -d codecs ] && [ -n "$(ls codecs | grep -vi readme || true)" ]; then echo "::error::codec files in the checkout"; exit 1; fi
          dir=build/$BOARD-satellite
          img=$dir/rfoundry_$BOARD.bin
          [ -f "$img" ] || { echo "::error::$img was not built"; exit 1; }
          if ls "$dir" | grep -qi codec; then echo "::error::a codec image in the build directory"; ls "$dir"; exit 1; fi
          bin=rfoundry_${BOARD}_satellite.bin
          cp "$img" "dist/$bin"
          ( cd dist && sha256sum "$bin" > "$bin.sha256" )
          short=$(git rev-parse --short=7 HEAD)
          {
            echo "**$BOARD_NAME only** (\`$BOARD\`): don't install this image on any other radio."
            echo
            echo "Its satellite build from commit \`$short\` (${GITHUB_REF_NAME}), built by GitHub Actions."
            echo
            echo "**The image has no codec.** The RadioFoundry installer keeps the codec that is already in a RadioFoundry radio, and says so before it writes. Nothing here has been run on a radio unless the board's bring-up record says so: [docs/testing](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/testing/README.md)."
            echo
            echo '```'
            grep -E '^ *(FLASH|RAM):' build.log || true
            grep -E '^stack check ' stack.log || true
            echo '```'
            echo
            echo "sha256: \`$(cut -d' ' -f1 "dist/$bin.sha256")\`"
          } > dist/notes.md
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "short=$short" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: satellite-image-${{ matrix.board }}
          path: |
            dist/rfoundry_*.bin
            dist/rfoundry_*.sha256
            build.log
            stack.log

      - name: Publish a pre-release (a direct download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="satellite-$BOARD-$short"
          title="$BOARD_NAME satellite build $short"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file dist/notes.md
          else
            gh release edit "$tag" --prerelease --title "$title" --notes-file dist/notes.md
          fi
          gh release upload "$tag" dist/rfoundry_*.bin dist/rfoundry_*.sha256 --clobber
          # keep this board's newest five (only pre-releases this workflow makes: satellite-<board>-<7 hex>)
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease and (.tagName | test(\"^satellite-${BOARD}-[0-9a-f]{7}\$\")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName" |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
